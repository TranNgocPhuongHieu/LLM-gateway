name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun for embedded frontend
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Build embedded frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:check

      - name: Run backend tests
        run: go test -mod=readonly -p 2 -timeout 90s ./...

  relaykit:
    name: Relaykit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: relaykit/go.mod
          cache: true

      - name: Run relaykit tests
        working-directory: relaykit
        run: go test -mod=readonly -p 2 -timeout 90s ./...

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: web
        run: bun run build:check

  diff-check:
    name: Diff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check
